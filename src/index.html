    <h1>Christmas Recipe</h1>
    <p>A pound of fun</p>
    <p>And a pound of joy</p>
    <p><u>Make a nice present</u></p>
    <p>For a girl or boy.</p>
    <p>A cup of goodness</p>
    <p>And a cup of love</p>
    <p>Really are gifts</p>
    <p>From heaven above.</p>
    <p>A pinch of holly</p>
    <p>And a pinch of pine -</p>
    <p>Now, we know</p>
    <p>It's Christmas time.</p>
    <hr>
<cite style="color:red">Gay Dowling</cite>
    <br>
    <p><a href="https://www.countryliving.com/life/kids-pets/g29539102/christmas-poems-for-kids/" target="_blank">Christmas Poems for Kids</a></p>
