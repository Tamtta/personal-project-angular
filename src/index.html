<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miss Kimchi</title>
    
    <style>
    p.asterisk::after {
          content: " *";
          color: red;
          margin-left: 4px; 
         }
    </style>
  </head>
  <body>
    <h1>Reservation Form</h1>
<form action="/submit" method="post" autocomplete="off">
 
  <!-- Full name -->
  <p class="asterisk">Full Name</p> 
  
  <label for="firt_name">First Name</label>
  <input type="text" id="firt_name" name="firt_name" required><br><br>
 
  <label for="middle_name">Middle Name</label>
  <input type="text" id="middle_name" name="middle_name"><br><br>
  
  <label for="last_name">Last Name</label>
  <input type="text" id="last_name" name="last_name" required><br><br>
  
  
   <!-- Contact details -->
  <label for="contact_number">Contact Number</label>
  <input type="text" id="contact_number" name="contact_number" placeholder="(000) 000 000" required><br><br>
 
  <label for="email">E-mail</label>
<input type="email" id="email" name="email" placeholder="ex: myname@example.com" required> <br> <br>
  
  <p>Please select your preferred contact method</p>
  
  <input type="radio" id="radiobtn_email" name="contact_method" value="email">
  <label for="radiobtn_email" >Email</label>

  <input type="radio" id="radiobtn_phone" name="contact_method" value="phone" checked>
  <label for="radiobtn_phone">Phone</label>
  
    <!-- Reservation details -->
   <p class="asterisk">Number of People</p>
  
 <label for="number_of_people"> </label>
  <select id="number_of_people" name="number_of_people" required>
  <option value="">Select an option</option>
  <option value="1">1</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
  <option value="5">5</option>
  <option value="6">6</option>
  <option value="7">7</option>
  <option value="8">8</option>
</select>
  
  <p class="asterisk">Reservatiom Date & Time</p>
  
  <label for="reservation_date">Date</label>
  <input type="date" id="reservation_date" name="reservation_date" required><br>
  
    <label for="reservation_time">Time</label>
  <input type="time" id="reservation_time" name="reservation_time" required><br>
  
  <p>Payment Method</p>
  <input type="radio" id="radiobtn_cash" name="payment_method" value="cash">
  <label for="radiobtn_cash">Cash</label>

  <input type="radio" id="radiobtn_crdcash" name="payment_method" value="credit card" checked>
  <label for="radiobtn_crdcash">Credit Card</label> <br> <br>

  
    <!-- Other preferances -->
<p>Other Preferences (optional)</p>

<label>
  <input type="checkbox" name="preferences[]" value="A table by the window">
  A table by the window
</label><br>

<label>
  <input type="checkbox" name="preferences[]" value="A quiet table for a romantic dinner/peaceful experience">
  A quiet table for a romantic dinner/peaceful experience
</label><br>

<label>
  <input type="checkbox" name="preferences[]" value="Outdoor seating preferred">
  Outdoor seating preferred
</label><br>

  <label>
  <input type="checkbox" name="preferences[]" value="Away from the kitchen/bar area">
  Away from the kitchen/bar area
</label><br>
  
    <label>
  <input type="checkbox" name="preferences[]" value="In a non-smoking section">
  In a non-smoking section
</label>
  
  <p>Menu Types (optional)</p>

<label>
  <input type="checkbox" name="menus[]" value="Static Menu">
  Static Menu
</label><br>

<label>
  <input type="checkbox" name="menus[]" value="À La Carte Menu">
 À La Carte Menu
</label><br>

<label>
  <input type="checkbox" name="menus[]" value="Table d'Hôte Menu">
  Table d'Hôte Menu
</label><br>

  <label>
  <input type="checkbox" name="menus[]" value="Cycle Menu">
  Cycle Menu
</label><br>
  
    <label>
  <input type="checkbox" name="menus[]" value="Dessert Menu">
  Dessert Menu
</label><br>
  
<label for="message">If you have any additional notes about this reservation, please write.</label> <br>
<textarea
  id="message"
  name="message"
  placeholder="Type here..."
  rows="5"
></textarea>
  

  <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form> 
    
   <div id="output"></div>
<script>
  const form = document.querySelector("form");
  const output = document.getElementById("output");

  form.addEventListener("submit", function (event) {
    event.preventDefault();

    const formData = new FormData(form);
    let html = "<h2>Submitted Values</h2><ul>";

    for (const [name, value] of formData.entries()) {
      html += `<li><strong>${name}</strong>: ${value}</li>`;
    }

    html += "</ul>";
    output.innerHTML = html;
    
    form.reset();
  });
</script>


  </body>
</html>
