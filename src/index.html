<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miss Kimchi</title>
    
    <style>
       body {
        margin: 10px; 
        background-color: #FFF0F5;
        display: flex; 
        justify-content: center; 
        align-items: center; 
        flex-direction: column
      } 
      
    .asterisk::after {
          content: "*";
          color: red;
          margin-left: 4px; 
         }
      
      div.forms {
      padding: 5px;
      margin: 5px
}

      input[type=text], input[type=email]  {
          background-color: white;
          border: 1px solid #FFF0F5
     }

      input[type=text]:focus, input[type=email]:focus {
          background-color: #f5d3e7;
          border: 3px solid #fcedf6;
    }
      
      div.kimchi {
        background-color: black;
        width: 100%;
        height: 100%;
        padding: 5px;
        margin: 5px;
        display: flex; 
        justify-content: center; 
        align-items: center; 
      }

      div.kimchi_and_forms { 
        margin: 0;
        padding: 0;
        width: 100%;
        display: flex; 
        justify-content: center; 
        align-items: center; 
        flex-direction: column
     }

      h1.kimchi-header {
      color: #FFF0F5;
      }
      
      div.full_name {
        display: flex; 
       justify-content: center;
        align-items: center; 
       }
      
      div.inside_full_name {
      margin: 15px 30px; 
      padding 5px; 
      display: flex; 
      justify-content: center;
      align-items: center; 
      flex-direction: column
      }
      
      div.contact_details {
       display: flex; 
       justify-content: center;
       align-items: center; 
      }
    
div.inside_contact_details {
      margin: 0 30px 30px 0; 
      padding 5px; 
      display: flex; 
      justify-content: center;
      align-items: center; 
      flex-direction: column
      }
      
      input[type="radio"] {
             accent-color: #f5d3e7; 
             transform: scale(1.5); 
      }
      
      select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-color: #f5d3e7;
            color: black;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 12px auto;
          }

    </style>
  </head>
  <body>   

<div class="kimchi_and_forms">

  <div class="kimchi">
  <h1 class="kimchi-header">Miss Kimchi</h1>
</div> 
  
<div class="forms"> <h1>Reservation Form</h1>
<form action="/submit" method="post" autocomplete="off">
 
  <!-- Full name -->
  <h3 class="asterisk">Full Name</h3> 
  
  <div class="full_name" style="background-color: green"> 
    
    <div class="inside_full_name">
      <input type="text" id="firt_name" name="firt_name" required><br>
      <label for="firt_name">First Name</label><br> 
    </div>
 
<div class="inside_full_name">  
<input type="text" id="middle_name" name="middle_name"><br>
  <label for="middle_name">Middle Name</label><br> 
    </div>
  
  
<div class="inside_full_name">
<input type="text" id="last_name" name="last_name" required><br>
  <label for="last_name">Last Name</label><br>
</div>
  </div>
  
   <!-- Contact details -->
 
<div class="contact_details" style="background-color: red">

<div class="inside_contact_details">
 <label for="contact_number" class="asterisk">Contact Number</label><br>
  <input type="text" id="contact_number" name="contact_number" placeholder="(000) 000 000" required>
</div>
 
  <div class="inside_contact_details">
  <label for="email" class="asterisk">E-mail</label> <br>
<input type="email" id="email" name="email" placeholder="ex: myname@example.com" required>

</div>
  
</div>
  <p>Please select your preferred contact method</p>
  
  <input type="radio" id="radiobtn_email" name="contact_method" value="email">
  <label for="radiobtn_email" >Email</label>

  <input type="radio" id="radiobtn_phone" name="contact_method" value="phone" checked>
  <label for="radiobtn_phone">Phone</label>
  
    <!-- Reservation details -->
   <p class="asterisk">Number of People</p>
  
 <label for="number_of_people"> </label>
  <select id="number_of_people" name="number_of_people" required>
  <option value="">Select an option</option>
  <option value="1">1</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
  <option value="5">5</option>
  <option value="6">6</option>
  <option value="7">7</option>
  <option value="8">8</option>
</select>
  
  <p class="asterisk">Reservatiom Date & Time</p>
  
  <label for="reservation_date">Date</label>
  <input type="date" id="reservation_date" name="reservation_date" required><br>
  
    <label for="reservation_time">Time</label>
  <input type="time" id="reservation_time" name="reservation_time" required><br>
  
  <p>Payment Method</p>
  <input type="radio" id="radiobtn_cash" name="payment_method" value="cash">
  <label for="radiobtn_cash">Cash</label>

  <input type="radio" id="radiobtn_crdcash" name="payment_method" value="credit card" checked>
  <label for="radiobtn_crdcash">Credit Card</label> <br> <br>

  
    <!-- Other preferances -->
<p>Other Preferences (optional)</p>

<label>
  <input type="checkbox" name="preferences[]" value="A table by the window">
  A table by the window
</label><br>

<label>
  <input type="checkbox" name="preferences[]" value="A quiet table for a romantic dinner/peaceful experience">
  A quiet table for a romantic dinner/peaceful experience
</label><br>

<label>
  <input type="checkbox" name="preferences[]" value="Outdoor seating preferred">
  Outdoor seating preferred
</label><br>

  <label>
  <input type="checkbox" name="preferences[]" value="Away from the kitchen/bar area">
  Away from the kitchen/bar area
</label><br>
  
    <label>
  <input type="checkbox" name="preferences[]" value="In a non-smoking section">
  In a non-smoking section
</label>
  
  <p>Menu Types (optional)</p>

<label>
  <input type="checkbox" name="menus[]" value="Static Menu">
  Static Menu
</label><br>

<label>
  <input type="checkbox" name="menus[]" value="À La Carte Menu">
 À La Carte Menu
</label><br>

<label>
  <input type="checkbox" name="menus[]" value="Table d'Hôte Menu">
  Table d'Hôte Menu
</label><br>

  <label>
  <input type="checkbox" name="menus[]" value="Cycle Menu">
  Cycle Menu
</label><br>
  
    <label>
  <input type="checkbox" name="menus[]" value="Dessert Menu">
  Dessert Menu
</label><br>
  
<label for="message">If you have any additional notes about this reservation, please write.</label> <br>
<textarea
  id="message"
  name="message"
  placeholder="Type here..."
  rows="5"
></textarea>
  

  <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form> 
    </div>

    </div>

   <div id="output" class="output"></div>
    
<script>
  const form = document.querySelector("form");
  const output = document.getElementById("output");

  form.addEventListener("submit", function (event) {
    event.preventDefault();

    const formData = new FormData(form);
    let html = "<h2>Submitted Values</h2><ul>";

    for (const [name, value] of formData.entries()) {
      html += `<li><strong>${name}</strong>: ${value}</li>`;
    }

    html += "</ul>";
    output.innerHTML = html;
    
    form.reset();
  });
</script>


  </body>
</html>
